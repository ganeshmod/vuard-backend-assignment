services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  server:
    build: .
    ports:
      - "8081:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://orders:orders@postgres:5432/orders?sslmode=disable
      REDIS_ADDR: redis:6379
      STREAM_NAME: order-events
      CONSUMER_GROUP: order-processors
      CONSUMER_NAME: worker-1
      PENDING_TTL: 5m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  generator:
    build: .
    entrypoint: ["/app/generator"]
    command: ["-rate", "5", "-redis", "redis:6379", "-stream", "order-events"]
    environment:
      REDIS_ADDR: redis:6379
      STREAM_NAME: order-events
    depends_on:
      server:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
